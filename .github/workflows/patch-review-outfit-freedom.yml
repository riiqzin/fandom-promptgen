name: Patch review outfit freedom

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add automatic, general and specific review outfits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'ffh-review-outfit-freedom-v1'

          if marker in text:
              raise SystemExit(0)

          old_state = "outfit:'c:casual'"
          if old_state not in text:
              raise SystemExit('Expected review outfit default was not found')
          text = text.replace(old_state, "outfit:'auto'", 1)

          start = text.find('function rvRenderOutfitOptions(){')
          end = text.find('function rvReviewifyOutfit', start)
          if start < 0 or end < 0:
              raise SystemExit('rvRenderOutfitOptions block not found')

          render_fn = r'''function rvRenderOutfitOptions(){
            var root=document.getElementById('rv-outfit-options');if(!root)return;
            rvBuildOutfitLabels();
            var cat=rvCurrentOutfitCatalog();
            var current=String(RV.outfit||'auto');
            var generalKey=current.indexOf('style:')===0?current.slice(6):'';
            var top='';

            top+='<div class="rv-outfit-mode-block">';
            top+='<div class="sub-label" style="margin-bottom:7px;">Liberdade do look</div>';
            top+='<div class="chips"><div class="chip'+(current==='auto'?' selected':'')+'" data-group="rv-outfit" data-value="auto" onclick="rvChip(this)">✨ Automático / Natural</div></div>';
            top+='<div class="rv-outfit-help">Deixa a IA montar um look cotidiano coerente com a pessoa e a camiseta, sem prender peças específicas.</div>';
            top+='</div>';

            top+='<div class="rv-outfit-mode-block">';
            top+='<div class="sub-label" style="margin-bottom:7px;">Estilo geral</div>';
            top+='<div class="chips">'+Object.keys(RV_COUPLE_OUTFITS).map(function(v){return '<div class="chip'+(generalKey===v?' selected':'')+'" data-group="rv-outfit" data-value="style:'+v+'" onclick="rvChip(this)">'+RV_COUPLE_OUTFITS[v]+'</div>';}).join('')+'</div>';
            top+='<div class="rv-outfit-help">Escolhe só a vibe. As peças exatas continuam livres para variar naturalmente.</div>';
            top+='</div>';

            if(!cat){
              if(current!=='auto'&&current.indexOf('style:')!==0)RV.outfit='auto';
              root.innerHTML=top+'<div class="rv-outfit-specific-note">Outfit específico fica disponível para fotos com uma pessoa. Em duas pessoas, use Automático ou um Estilo geral para manter os dois looks naturais e diferentes.</div>';
              return;
            }

            var selected=current.indexOf(cat.prefix)===0?current.slice(2):'';
            var buckets={};
            Object.keys(cat.source).forEach(function(v){
              var label=cat.labels[v]||v.replace(/-/g,' ');
              var folder=rvOutfitCategory(v,label);(buckets[folder]||(buckets[folder]=[])).push({v:v,label:label});
            });
            var order=['Streetwear','Y2K & Retrô','Baddie','Grunge & Dark','Clean & Minimal','Sport & Athleisure','Casual & Denim','Outros estilos'];
            var folders='<div class="rv-outfit-mode-block rv-outfit-specific"><div class="sub-label" style="margin-bottom:7px;">Outfit específico</div><div class="rv-outfit-help" style="margin-bottom:9px;">Use apenas quando quiser controlar exatamente as peças do look.</div><div class="outfit-folder-list">'+order.filter(function(folder){return buckets[folder]&&buckets[folder].length;}).map(function(folder){
              var open=buckets[folder].some(function(x){return x.v===selected;});
              return '<div class="outfit-folder'+(open?' open':'')+'"><button type="button" class="outfit-folder-head" onclick="this.parentElement.classList.toggle(\'open\')"><span class="outfit-folder-title">📁 '+folder+' <span class="outfit-folder-count">'+buckets[folder].length+' looks</span></span><span class="outfit-folder-arrow">⌄</span></button><div class="outfit-folder-body"><div class="chips">'+buckets[folder].map(function(x){return '<div class="chip'+(x.v===selected?' selected':'')+'" data-group="rv-outfit" data-value="'+cat.prefix+x.v+'" onclick="rvChip(this)">'+x.label+'</div>';}).join('')+'</div></div></div>';
            }).join('')+'</div></div>';
            root.innerHTML=top+folders;
          }
          '''
          text = text[:start] + render_fn + text[end:]

          start = text.find('function rvOutfitText(){')
          end = text.find('function rvHomeText()', start)
          if start < 0 or end < 0:
              raise SystemExit('rvOutfitText block not found')

          outfit_text_fn = r'''function rvOutfitText(){
            if(!rvUsesOutfit())return '';
            var v=String(RV.outfit||'auto');
            if(v==='auto'){
              if(RV.person==='casal')return 'Outfits: let both customers wear naturally different everyday clothes chosen freely and plausibly from their own wardrobes. Do not lock them to a named fashion aesthetic or specific garments. Keep the styling incidental, varied and uncurated, as in a real customer review photo.';
              return 'Outfit: choose natural everyday clothing freely around the t-shirt, appropriate to this person and context. Do not lock the look to a named fashion aesthetic or specific garments. The lower-body clothing, shoes and accessories should feel incidental, personally owned and naturally varied rather than deliberately styled for the photo.';
            }
            if(v.indexOf('style:')===0){
              var styleKey=v.slice(6);
              var style=RV_OUTFIT_STYLE[styleKey]||RV_OUTFIT_STYLE.casual;
              return style[RV.person]||style.casal||style.homem||'';
            }
            if(v.indexOf('f:')===0){var kf=v.slice(2);return rvReviewifyOutfit(OUTFIT_F[kf]||'');}
            if(v.indexOf('m:')===0){var km=v.slice(2);return rvReviewifyOutfit(OUTFIT_M[km]||'');}
            var legacy=v.indexOf('c:')===0?v.slice(2):v;
            var o=RV_OUTFIT_STYLE[legacy]||RV_OUTFIT_STYLE.casual;
            return o[RV.person]||o.casal||o.homem||'';
          }
          '''
          text = text[:start] + outfit_text_fn + text[end:]

          old_help = 'Os looks usam a mesma biblioteca detalhada da aba Gerar, mas o prompt os adapta para parecerem roupas reais do próprio cliente — sem styling de campanha.'
          new_help = 'Comece em Automático / Natural para manter a liberdade original das avaliações. Se quiser mais controle, escolha só um estilo geral ou abra um outfit específico da biblioteca da aba Gerar.'
          if old_help in text:
              text = text.replace(old_help, new_help, 1)

          old_random = "var standard=['rv-ratio','rv-tshirt','rv-type','rv-print-side','rv-frame','rv-person','rv-age','rv-traits','rv-grooming','rv-outfit','rv-scene','rv-cam','rv-light'];\n  standard.forEach(function(group){var pick=rvWeightedPick(group);if(pick)rvChip(pick);});"
          new_random = "var standard=['rv-ratio','rv-tshirt','rv-type','rv-print-side','rv-frame','rv-person','rv-age','rv-traits','rv-grooming','rv-scene','rv-cam','rv-light'];\n  standard.forEach(function(group){var pick=rvWeightedPick(group);if(pick)rvChip(pick);});\n  var outfitChoices=Array.from(document.querySelectorAll('[data-group=\"rv-outfit\"]'));\n  var autoChoice=outfitChoices.find(function(ch){return ch.dataset.value==='auto';});\n  var styleChoices=outfitChoices.filter(function(ch){return String(ch.dataset.value||'').indexOf('style:')===0;});\n  var specificChoices=outfitChoices.filter(function(ch){return /^[fm]:/.test(String(ch.dataset.value||''));});\n  var roll=Math.random(), outfitPick=null;\n  if(roll<0.55&&autoChoice)outfitPick=autoChoice;\n  else if(roll<0.9&&styleChoices.length)outfitPick=styleChoices[Math.floor(Math.random()*styleChoices.length)];\n  else if(specificChoices.length)outfitPick=specificChoices[Math.floor(Math.random()*specificChoices.length)];\n  else outfitPick=autoChoice||styleChoices[0];\n  if(outfitPick)rvChip(outfitPick);"
          if old_random not in text:
              raise SystemExit('Review randomizer block not found')
          text = text.replace(old_random, new_random, 1)

          css = r'''

          <style id="ffh-review-outfit-freedom-v1">
          #reviews-panel .rv-outfit-mode-block{
            padding:11px 12px;
            border:1px solid rgba(255,255,255,.065);
            background:rgba(255,255,255,.018);
            border-radius:12px;
            margin-bottom:10px;
          }
          #reviews-panel .rv-outfit-mode-block:first-child{
            border-color:rgba(201,168,76,.25);
            background:linear-gradient(145deg,rgba(201,168,76,.07),rgba(255,255,255,.012));
          }
          #reviews-panel .rv-outfit-help{
            font-size:10px;
            line-height:1.5;
            color:var(--text-muted);
            margin-top:7px;
          }
          #reviews-panel .rv-outfit-specific-note{
            padding:10px 12px;
            border:1px dashed rgba(255,255,255,.08);
            border-radius:10px;
            color:var(--text-muted);
            font-size:10px;
            line-height:1.5;
          }
          #reviews-panel .rv-outfit-specific{margin-bottom:0;}
          </style>
          '''
          text += css
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          Path('/tmp/promptgen-check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/promptgen-check.js

      - name: Remove one-time workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-review-outfit-freedom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-review-outfit-freedom.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add flexible review outfit modes"
          git push origin HEAD:main
